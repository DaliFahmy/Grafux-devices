[pytest]
asyncio_mode = auto
# tests/fixtures holds INPUT files, not tests: RTL, a cocotb testbench, sample
# results.xml. The cocotb testbench is named test_sync_fifo.py because that is
# what it is, and collecting it here would fail on `import cocotb` (which is
# installed in the verify image, not in this repo's dev environment).
norecursedirs = fixtures
