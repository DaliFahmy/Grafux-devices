# Builds ONE generated Grafux block image. Dispatched by the devices server
# (GENERATOR/builder.py) with the branch holding the build context and the tag.
#
# The run-name is load-bearing: a dispatch returns no run id, so the server finds
# this run by its title "build <tag>". Do not change it without builder.find_run.
name: Build generated block
run-name: build ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch holding the build context (build/<tag>)
        required: true
      tag:
        description: Image tag in ghcr.io/dalifahmy/grafux-gen
        required: true

env:
  IMAGE: ghcr.io/dalifahmy/grafux-gen

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write     # to delete the build branch afterwards
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      # The Dockerfile ends with Grafux's trailer, whose last RUN is the self-test
      # (grafux-selftest.sh). Its "GRAFUX SELFTEST" lines are what the server
      # extracts from this log and hands back to the agent as its repair order.
      - name: Build (includes the Grafux self-test)
        run: |
          docker buildx build --platform linux/amd64 --progress plain --load \
            -t "${IMAGE}:${{ inputs.tag }}" .

      - name: The image meets the pod contract
        run: |
          docker run --rm --entrypoint bash "${IMAGE}:${{ inputs.tag }}" -lc \
            'test -x /start.sh && (command -v sshd || test -x /usr/sbin/sshd)'

      - name: Push
        run: docker push "${IMAGE}:${{ inputs.tag }}"

      - name: Clean up the build branch
        if: always()
        run: git push origin --delete "${{ inputs.branch }}" || true
