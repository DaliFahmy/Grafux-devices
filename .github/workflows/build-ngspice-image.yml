# Build and publish the NGSPICE image (the analogue_simulator block) to GHCR.
#
# The smoke test RUNS REAL SIMULATIONS, and every deck it runs is generated by
# EDA/ngspice.py's own build_ngspice_deck and read back by that module's own
# parsers -- the same code the devices server and the pod use.  So an image that
# ships a model library at a different path, a corner name upstream renamed, or
# an ngspice that stops honouring .control under -b fails HERE, not on a rented
# pod.  It proves, each against the pinned releases:
#
#   1. sky130A: an inverter transient at the ss corner and 85 C loads the corner
#      library, simulates, and yields a propagation delay in a sane range;
#   2. gf180mcuD: an inverter op + DC sweep loads design.ngspice plus the
#      typical sections, and the switching point lands between the rails;
#   3. no PDK: an RC AC sweep gives a -3 dB frequency within 2% of 1/(2 pi R C);
#   4. a deck with a nonexistent device is classified as an ERROR (ngspice's exit
#      code alone would not say so reliably).
#
# GHCR answers a package that was never pushed with a bare `denied`, which reads
# as a credentials problem -- the last step is the anonymous probe that tells the
# two apart (see the openram/verification-loop notes).
name: Build ngspice image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Image tag to build. MUST match EDA/models.py DEFAULT_NGSPICE_IMAGE and
          render.yaml EDA_NGSPICE_IMAGE.
        required: true
        default: "ng47-pdk1689ac3-20260913"
      ngspice_version:
        description: ngspice release (sourceforge ng-spice-rework/<version>)
        required: true
        default: "47"
      pdk_hash:
        description: open_pdks commit published on fossi-foundation/ciel-releases for BOTH sky130 and gf180mcu
        required: true
        default: "1689ac3f2dc763876eaf967227c7dfe831b031ae"
      push_image:
        description: "Push to GHCR (uncheck to build + smoke-test only)"
        type: boolean
        required: true
        default: true

env:
  IMAGE: ghcr.io/dalifahmy/grafux-ngspice

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: EDA/docker
          file: EDA/docker/Dockerfile.ngspice
          platforms: linux/amd64
          # NGSPICE_SHA256 is not an input: the Dockerfile pins the checksum of
          # the default release, and a different ngspice_version must update it.
          build-args: |
            NGSPICE_VERSION=${{ inputs.ngspice_version }}
            PDK_HASH=${{ inputs.pdk_hash }}
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate the decks the RUNNER would generate
        run: |
          set -euo pipefail
          mkdir -p /tmp/sim
          python3 - <<'PY'
          import os, shutil
          from types import SimpleNamespace as NS
          from EDA import ngspice as ng

          base = dict(corner="", temperature="", supply_voltage="", analyses="",
                      meas_statements="", probes="", max_points="", extra_control="")
          cases = {
              "sky130": dict(pdk="sky130A", corner="ss", temperature="85", supply_voltage="1.8",
                  probes="v(in) v(out)",
                  netlist="sky130 inverter\nVdd vdd 0 {vdd}\nVin in 0 PULSE(0 {vdd} 0 50p 50p 1n 2n)\n"
                          "XM1 out in 0 0 sky130_fd_pr__nfet_01v8 W=1 L=0.15\n"
                          "XM2 out in vdd vdd sky130_fd_pr__pfet_01v8 W=2 L=0.15\nC1 out 0 10f\n.tran 1p 4n\n",
                  meas_statements=".meas tran tpd TRIG v(in) VAL=0.9 RISE=1 TARG v(out) VAL=0.9 FALL=1"),
              "gf180": dict(pdk="gf180mcuD", supply_voltage="3.3", analyses="op\ndc Vin 0 3.3 0.01",
                  netlist="gf180 inverter\nVdd vdd 0 {vdd}\nVin in 0 0\n"
                          "M1 out in 0 0 nfet_03v3 W=1u L=0.28u\nM2 out in vdd vdd pfet_03v3 W=2u L=0.28u\n",
                  meas_statements=".meas dc vm WHEN v(out)=v(in)"),
              "rc_ac": dict(pdk="none", analyses="ac dec 20 1 1meg", probes="out",
                  netlist="rc\nV1 in 0 AC 1\nR1 in out 1k\nC1 out 0 1u\n",
                  meas_statements=".meas ac f3db WHEN vdb(out)=-3"),
              "broken": dict(pdk="sky130A",
                  netlist="broken\nVdd vdd 0 1.8\nXM1 vdd vdd 0 0 sky130_fd_pr__nfet_99v9 W=1 L=0.15\n.op\n"),
          }
          for name, kw in cases.items():
              req = NS(**{**base, **kw})
              refusal = ng.analogue_preflight(req)
              assert not refusal, (name, refusal)
              deck, _run, _notes = ng.build_ngspice_deck(req, pdk_root="/opt/pdks")
              d = f"/tmp/sim/{name}"
              os.makedirs(d, exist_ok=True)
              open(f"{d}/{ng.DECK_FILE}", "w").write(deck)
              open(f"{d}/{ng.SPICEINIT_FILE}", "w").write(ng.spiceinit_for(req.pdk, threads=2))
              print(f"--- {name} ---\n{deck}")
          shutil.copy(ng.__file__, f"/tmp/sim/{ng.SCRIPT_FILE}")
          PY

      - name: Simulate inside the image
        run: |
          set -euo pipefail
          img="${IMAGE}:${{ inputs.tag }}"
          docker run --rm -v /tmp/sim:/sim "$img" bash -lc '
            set -u
            $GRAFUX_NGSPICE_CMD -v | head -3
            echo "open_pdks: $(cat $PDK_ROOT/OPEN_PDKS_COMMIT)"; du -sh "$PDK_ROOT"
            for k in sky130 gf180 rc_ac broken; do
              cd /sim/$k && rm -f sim.raw
              set -o pipefail
              $GRAFUX_NGSPICE_CMD -b deck.sp 2>&1 | tee sim.log >/dev/null; echo "$k exit=$?"
              python3 /sim/grafux_ngspice.py postprocess sim.raw 200 "[]" > post.json
            done
          '
          {
            echo "### ngspice image \`${img}\`"
            echo '```'
            docker run --rm "$img" bash -lc '$GRAFUX_NGSPICE_CMD -v | head -2; du -sh $PDK_ROOT/*'
            docker image inspect "$img" --format 'image size: {{.Size}} bytes'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the results with the runner's own parsers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, sys
          from EDA import ngspice as ng

          def load(name):
              log = open(f"/tmp/sim/{name}/sim.log").read()
              deck = open(f"/tmp/sim/{name}/deck.sp").read()
              post = json.load(open(f"/tmp/sim/{name}/post.json"))
              values, _ = ng.parse_measurements(log, ng.measure_names(deck))
              errors, warnings, hints = ng.classify_ngspice_log(log, 0)
              return log, post, values, errors, hints

          problems = []
          def expect(cond, msg):
              print(("ok   " if cond else "FAIL ") + msg)
              if not cond:
                  problems.append(msg)

          log, post, v, errors, _ = load("sky130")
          expect(not errors, f"sky130 ran clean (errors={errors})")
          expect("TEMP = 85" in log, "sky130 ran at 85 C")
          expect(v.get("tpd") is not None and 1e-12 < v["tpd"] < 1e-9, f"sky130 tpd in (1ps, 1ns): {v.get('tpd')}")
          expect(post["waveforms"].startswith("time,v(in),v(out)"), "sky130 waveforms are plotter-shaped")

          log, post, v, errors, _ = load("gf180")
          expect(not errors, f"gf180 ran clean (errors={errors})")
          expect(v.get("vm") is not None and 0.5 < v["vm"] < 2.8, f"gf180 switching point between the rails: {v.get('vm')}")
          expect(abs(post["operating_point"].get("v(vdd)", 0) - 3.3) < 1e-6, "gf180 operating point read from the op plot")

          log, post, v, errors, _ = load("rc_ac")
          ideal = 1 / (2 * math.pi * 1e3 * 1e-6)
          expect(not errors, f"rc ac ran clean (errors={errors})")
          expect(v.get("f3db") is not None and abs(v["f3db"] - ideal) / ideal < 0.02, f"rc f3db {v.get('f3db')} vs {ideal:.2f}")
          expect(post["waveforms"].startswith("frequency,vdb(out),vp(out)"), "ac waveforms are Bode columns")

          log, post, v, errors, hints = load("broken")
          expect(any("unknown subckt" in e for e in errors), f"broken deck is an error: {errors}")
          expect(bool(hints), "broken deck carries a hint")

          if problems:
              sys.exit("::error::" + "; ".join(problems))
          PY

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ngspice-smoke-logs
          path: /tmp/sim

      - name: Push
        if: ${{ inputs.push_image }}
        run: docker push "${IMAGE}:${{ inputs.tag }}"

      - name: Verify the package is anonymously pullable
        if: ${{ inputs.push_image }}
        run: |
          set -uo pipefail
          img="${IMAGE}:${{ inputs.tag }}"
          body=$(curl -sS "https://ghcr.io/token?scope=repository:dalifahmy/grafux-ngspice:pull&service=ghcr.io")
          if echo "$body" | grep -q '"token"'; then
            echo "### Published: \`$img\` (public, anonymously pullable)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Pushed \`$img\`, but the GHCR package is still PRIVATE"
            echo ""
            echo "RunPod pulls anonymously and will fail with \`IMAGE_AUTH_ERROR ... denied\`."
            echo "Fix once: https://github.com/users/DaliFahmy/packages/container/grafux-ngspice/settings"
            echo "-> Danger Zone -> Change visibility -> Public"
            echo ""
            echo "GHCR said: \`$body\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::grafux-ngspice is not anonymously pullable; make the GHCR package public"
          exit 1
