# Build and publish the hand-written OpenRAM CUSTOM block example to GHCR.
#
# Two jobs in one:
# 1. It proves the custom-block contract on a real image.  The Dockerfile's last
#    step runs /opt/grafux/selftest.sh, which fills $GRAFUX_IN from the
#    manifest's selftest.inputs, runs /opt/grafux/run.sh, and fails the BUILD if
#    any selftest.expect_outputs is missing.  Every generated image uses the same
#    rule, so a green run here means the rule works.
# 2. It creates the ONE package every generated block is pushed to --
#    ghcr.io/dalifahmy/grafux-gen -- with per-block TAGS.  One package means the
#    "new GHCR packages are private and there is no API to change that" trap is
#    paid exactly once, here, instead of once per generated block.
#
# MANUAL STEP AFTER THE FIRST RUN: make the package public at
#   https://github.com/users/DaliFahmy/packages/container/grafux-gen/settings
#   -> Danger Zone -> Change visibility -> Public
# RunPod pulls anonymously; the last step fails the job while it is private.
name: Build custom example image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag to publish. MUST match runtime.image in
          CUSTOM/examples/openram/grafux-block.json.
        required: true
        default: "example-openram-1"
      push_image:
        description: "Push to GHCR (uncheck to build + self-test only)"
        type: boolean
        required: true
        default: true

env:
  IMAGE: ghcr.io/dalifahmy/grafux-gen

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: The manifest names the tag being built
        run: |
          set -euo pipefail
          want="${IMAGE}:${{ inputs.tag }}"
          got=$(python3 -c "import json;print(json.load(open('CUSTOM/examples/openram/grafux-block.json'))['runtime']['image'])")
          [ "$got" = "$want" ] || { echo "::error::manifest runtime.image is $got, building $want"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The self-test runs INSIDE this build (the Dockerfile's last RUN), so a
      # green build is a compiled 2x16 macro, not just an image that exists.
      - name: Build (includes the self-test)
        uses: docker/build-push-action@v6
        with:
          context: CUSTOM/examples/openram
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}
          load: true
          push: false

      - name: The image meets the SSH contract
        run: |
          set -euo pipefail
          docker run --rm "${IMAGE}:${{ inputs.tag }}" bash -lc \
            'command -v sshd && test -x /start.sh && test -x /opt/grafux/run.sh'

      - name: Push
        if: ${{ inputs.push_image }}
        run: docker push "${IMAGE}:${{ inputs.tag }}"

      - name: Verify the package is anonymously pullable
        if: ${{ inputs.push_image }}
        run: |
          set -uo pipefail
          body=$(curl -sS "https://ghcr.io/token?scope=repository:dalifahmy/grafux-gen:pull&service=ghcr.io")
          if echo "$body" | grep -q '"token"'; then
            echo "### Published \`${IMAGE}:${{ inputs.tag }}\` (public)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::grafux-gen is not anonymously pullable; make the GHCR package public (see header)"
          exit 1
