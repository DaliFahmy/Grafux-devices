# Build and publish the OPENGCRAM image (the gain-cell memory compiler) to GHCR.
#
# WHAT THIS SMOKE TEST CAN AND CANNOT PROVE.  build-openram-image.yml compiles a
# real macro.  This one cannot: no public technology contains a gain cell (see
# the header of EDA/docker/Dockerfile.opengcram), so there is nothing to compile
# FOR.  Rather than pretend, it proves every link of the chain that does not
# need one, each against the code that ships:
#
#   1. the compiler and all its Python dependencies import, and the entry point
#      that GRAFUX_OPENGCRAM_CMD names exists and parses its arguments;
#   2. a config generated by EDA/flow.py's own build_openram_config(gain_cell=True)
#      is valid Python in the image's interpreter;
#   3. EDA/flow.py's own gain-cell probe, run inside the image under the real
#      _OPENGCRAM_ENV, REFUSES the freepdk45 the image ships and ACCEPTS a
#      technology directory that carries os_gc -- i.e. the refusal a user sees is
#      the one the code intends, not an accident of a missing path.
#
# It also attempts the compile against freepdk45 and keeps the log as an
# artifact, NOT as a gate: that log is what upstream does with no gain cell, and
# is worth reading when someone asks why the refusal exists.
#
# A successful gain-cell compile can only be verified by someone holding a
# technology that has one, via scripts/e2e_opengcram_smoke.py --tech-archive.
#
# GHCR packages are created PRIVATE on first push; the last step fails the job
# until the package is public, because RunPod pulls anonymously.
name: Build opengcram image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Image tag to build. MUST match EDA/models.py DEFAULT_OPENGCRAM_IMAGE and
          render.yaml EDA_OPENGCRAM_IMAGE.
        required: true
        default: "cbdc35b-20260913"
      opengcram_ref:
        description: >-
          OpenGCRAM commit to build from. Upstream has no tags; pin a commit.
        required: true
        default: "cbdc35b"
      push_image:
        description: "Push to GHCR (uncheck to build + smoke-test only)"
        type: boolean
        required: true
        default: true

env:
  IMAGE: ghcr.io/dalifahmy/grafux-opengcram

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: EDA/docker
          file: EDA/docker/Dockerfile.opengcram
          platforms: linux/amd64
          build-args: |
            OPENGCRAM_REF=${{ inputs.opengcram_ref }}
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate what the RUNNER would generate
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pydantic
          python3 - <<'PY'
          from EDA import flow
          from EDA.models import OpenGcRamRunRequest
          req = OpenGcRamRunRequest(word_size="2", num_words="16", gc_type="OS",
                                    tech_name="freepdk45", netlist_only="1")
          open("/tmp/gcram_config.py", "w").write(flow.build_openram_config(
              req, tech="freepdk45", output_name="grafux_smoke",
              out_dir="/tmp/gcram_out", gain_cell=True))
          open("/tmp/probe_freepdk45.sh", "w").write(
              flow._OPENGCRAM_ENV + flow.gain_cell_probe_command("freepdk45"))
          open("/tmp/probe_fake.sh", "w").write(
              flow._OPENGCRAM_ENV + flow.gain_cell_probe_command("faketech"))
          PY
          echo "--- the config under test ---"
          cat /tmp/gcram_config.py

      - name: Smoke-test the image
        run: |
          set -euo pipefail
          img="${IMAGE}:${{ inputs.tag }}"
          docker run --rm -v /tmp:/host:ro "$img" bash -lc '
            set -e
            command -v sshd python3
            echo "--- OpenGCRAM at ---"; git -C /opt/opengcram rev-parse --short HEAD
            echo "--- technologies this image ships ---"; ls -1 "$OPENRAM_TECH"
            echo "--- 1. the package and its dependencies import ---"
            cd /opt/opengcram && python3 -c "from common import *; make_openram_package(); import openram; print(\"gc_type default:\", openram.OPTS.gc_type)"
            test -f /opt/opengcram/gain_cell_compiler.py
            set +e; $GRAFUX_OPENGCRAM_CMD >/tmp/usage.txt 2>&1; code=$?; set -e
            cat /tmp/usage.txt; test "$code" = 2
            echo "--- 2. the generated config is valid Python here ---"
            # compile() rather than py_compile: /host is a read-only mount and
            # py_compile writes __pycache__ beside the file.
            python3 -c "compile(open(\"/host/gcram_config.py\").read(), \"gcram_config.py\", \"exec\")"
          ' 2>&1 | tee /tmp/gcram_smoke.log

          echo "--- 3a. the probe on the shipped freepdk45 ---"
          docker run --rm -v /tmp:/host:ro "$img" bash -lc 'bash /host/probe_freepdk45.sh' \
            | tee /tmp/probe_freepdk45.txt
          echo "--- 3b. the probe on a technology that carries os_gc ---"
          docker run --rm -v /tmp:/host:ro "$img" bash -lc '
            mkdir -p /workspace/grafux/gcram_tech/faketech/gds_lib /workspace/grafux/gcram_tech/faketech/sp_lib
            touch /workspace/grafux/gcram_tech/faketech/gds_lib/os_gc.gds /workspace/grafux/gcram_tech/faketech/sp_lib/os_gc.sp
            bash /host/probe_fake.sh' | tee /tmp/probe_fake.txt

          python3 - <<'PY'
          import sys
          from EDA import flow
          free = open("/tmp/probe_freepdk45.txt").read()
          fake = open("/tmp/probe_fake.txt").read()
          refusal = flow.check_gain_cell_listing(free, tech="freepdk45", gc_type="OS", netlist_only=False)
          accept = flow.check_gain_cell_listing(fake, tech="faketech", gc_type="OS", netlist_only=False)
          print("freepdk45 ->", refusal or "(accepted!)")
          print("faketech  ->", accept or "(accepted)")
          if "DIR:" not in free or "SRAM-only" not in refusal:
              sys.exit("::error::the probe did not find freepdk45 or did not refuse it as SRAM-only")
          if accept:
              sys.exit("::error::the probe refused a technology that carries os_gc")
          PY

      - name: Attempt a compile against freepdk45 (informational)
        continue-on-error: true
        run: |
          img="${IMAGE}:${{ inputs.tag }}"
          docker run --rm -v /tmp:/host:ro "$img" bash -lc '
            mkdir -p /tmp/gcram_out && cd /tmp && cp /host/gcram_config.py . && $GRAFUX_OPENGCRAM_CMD gcram_config.py
          ' > /tmp/gcram_freepdk45_attempt.log 2>&1
          echo "exit: $?"; tail -40 /tmp/gcram_freepdk45_attempt.log
          {
            echo '### What upstream does with no gain cell (freepdk45, last 40 lines)'
            echo '```'; tail -40 /tmp/gcram_freepdk45_attempt.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opengcram-smoke-logs
          path: |
            /tmp/gcram_smoke.log
            /tmp/gcram_config.py
            /tmp/probe_freepdk45.txt
            /tmp/probe_fake.txt
            /tmp/gcram_freepdk45_attempt.log

      - name: Push
        if: ${{ inputs.push_image }}
        run: docker push "${IMAGE}:${{ inputs.tag }}"

      - name: Verify the package is anonymously pullable
        if: ${{ inputs.push_image }}
        run: |
          set -uo pipefail
          img="${IMAGE}:${{ inputs.tag }}"
          body=$(curl -sS "https://ghcr.io/token?scope=repository:dalifahmy/grafux-opengcram:pull&service=ghcr.io")
          if echo "$body" | grep -q '"token"'; then
            echo "### Published: \`$img\` (public, anonymously pullable)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Pushed \`$img\`, but the GHCR package is still PRIVATE"
            echo ""
            echo "RunPod pulls anonymously and will fail with \`IMAGE_AUTH_ERROR ... denied\`."
            echo "Fix once: https://github.com/users/DaliFahmy/packages/container/grafux-opengcram/settings"
            echo "-> Danger Zone -> Change visibility -> Public"
            echo ""
            echo "GHCR said: \`$body\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::grafux-opengcram is not anonymously pullable; make the GHCR package public"
          exit 1
