services:
  - type: web
    name: grafux-devices
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn device.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: AGENT_TOKEN
        generateValue: true
      # OpenClaw runtime — Anthropic key used to run and scaffold claws.
      # sync:false => set the secret value in the Render dashboard, not in the repo.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Composio key — used by the claw connections REST calls (list / send-message
      # actions). The MCP server URL itself is self-authenticating, so this is only
      # needed for the inbound-reply / management paths. Set it in the dashboard.
      - key: COMPOSIO_API_KEY
        sync: false
      # RunPod key — used by the GPU runtime to provision pods and SSH in. With this
      # set, the user can create a gpu block and connect with no per-block key. Set
      # the secret value in the Render dashboard.
      - key: RUNPOD_API_KEY
        sync: false
      # Default pod image (CUDA -devel, ships Python 3.11 + PyTorch + nvcc). Pinned
      # to CUDA 12.4 because a 12.4 container runs on the broadly-deployed R550 host
      # driver; a 12.8 image needs R570+ which many machines lack, so its container
      # init fails ("nvidia-container-cli: unsatisfied condition: cuda>=12.8") and the
      # pod never comes up. Set a newer cuda image only if you need a newer toolkit.
      - key: GPU_DEFAULT_IMAGE
        value: "runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04"
      # Ephemeral GPU lifecycle (default on): terminate the pod the instant a run
      # finishes so a GPU only costs money while it is actually compiling/running
      # (idle cost $0; the block re-provisions automatically on the next Run). Set
      # to 0 to keep pods warm between runs (create-once/run-many) instead.
      - key: GPU_EPHEMERAL
        value: "1"
      # Idle reaper backstop: terminate a provisioned-but-never-run GPU pod after
      # this many minutes idle, so a forgotten pod cannot bill forever. Ephemeral
      # runs already self-terminate; this only catches Regenerate-and-walk-away
      # pods (and warm pods when GPU_EPHEMERAL=0). Set to 0 to disable.
      - key: GPU_IDLE_TIMEOUT_MIN
        value: "10"
      # How long (seconds) to wait, PER ATTEMPT, for a freshly-created pod to come
      # up with a public SSH endpoint. Large CUDA -devel images take minutes to pull
      # on a cold machine; raise it if Regenerate times out mid-pull.
      - key: GPU_PROVISION_TIMEOUT
        value: "300"
      # supportPublicIp does not GUARANTEE a public IP — it is a per-machine
      # capability, so a pod can come up RUNNING with publicIp="" forever. Provision
      # retries this many times, terminating and recreating to hop to a different
      # machine, on a no-public-IP placement OR transient "no instances available".
      - key: GPU_PROVISION_ATTEMPTS
        value: "3"
      # The public IP/port-22 mapping is assigned at machine placement, before the
      # image finishes pulling. If it has not appeared this many seconds after the
      # pod is placed, the machine has no public-IP networking — fail fast and hop
      # instead of waiting the full GPU_PROVISION_TIMEOUT. Set to 0 to disable.
      - key: GPU_PUBLIC_IP_GRACE
        value: "120"
      # Default keep-warm window (minutes) when neither the run request nor the
      # block's spec sets keep_warm_minutes. 0 keeps the ephemeral default; a small
      # value (e.g. 5) makes iterative dev fast out of the box at a small idle cost.
      # A per-block keep_warm_minutes input port overrides this.
      - key: GPU_DEFAULT_KEEP_WARM_MIN
        value: "0"
      # Expose a pod's SSH host/port + PRIVATE KEY via GET /gpu/{id}/ssh so a user
      # can open their own terminal. OFF by default — it returns a secret key, so
      # only enable it on a trusted-network deployment. The block's "Copy SSH
      # command" still works without this (it only needs host/port from /status).
      - key: GPU_EXPOSE_SSH
        value: "0"
      # Caps on artifact bytes downloaded from the pod after a run (per file / total)
      # so a large output can never bloat the run response. Bytes.
      - key: GPU_ARTIFACT_MAX_FILE_BYTES
        value: "2097152"
      - key: GPU_ARTIFACT_MAX_TOTAL_BYTES
        value: "8388608"
      # ---------------------------------------------------------------------
      # EDA runtime — the verilator / yosys / openroad chip-design blocks.
      # Shares RUNPOD_API_KEY (declared above) with the gpu block.
      # ---------------------------------------------------------------------
      # The EDA container image: OpenROAD-flow-scripts + Verilator + sky130,
      # plus the openssh-server and PUBLIC_KEY handling that stock openroad/orfs
      # lacks (see EDA/docker/Dockerfile — without it a pod comes up with nothing
      # listening on port 22 and provisioning fails with a misleading
      # "no public-IP networking" error). PIN THE TAG; never track :latest here.
      - key: EDA_DEFAULT_IMAGE
        value: "ghcr.io/dalifahmy/grafux-eda:sky130-20260901"
      # Default process design kit / OpenROAD platform. sky130hd is the standard
      # open-source target and what every public ORFS example uses.
      - key: EDA_DEFAULT_PDK
        value: "sky130hd"
      # EDA tools are CPU-bound — synthesis and place-and-route never touch a GPU —
      # so rent a CPU instance. Set to GPU (and point EDA_DEFAULT_INSTANCE at e.g.
      # "NVIDIA RTX A4000") only as a fallback if RunPod CPU pods misbehave.
      - key: EDA_COMPUTE_TYPE
        value: "CPU"
      # <family>-<vcpus>. RunPod takes the family in cpuFlavorIds and the vCPU
      # count in a separate vcpuCount field; pod_client splits this id.
      - key: EDA_DEFAULT_INSTANCE
        value: "cpu3c-8"
      # Release the pod as soon as a run finishes, so idle cost is $0.
      - key: EDA_EPHEMERAL
        value: "1"
      # Keep-warm is longer than the gpu block's 0: iterating on a floorplan or
      # re-running a testbench is unusable if every attempt re-pulls a multi-GB
      # image, and 15 min of a ~$0.12/hr CPU instance is about three cents.
      - key: EDA_DEFAULT_KEEP_WARM_MIN
        value: "15"
      # Backstop for pods provisioned but never run. Longer than the gpu block's
      # so it never races the keep-warm window above.
      - key: EDA_IDLE_TIMEOUT_MIN
        value: "20"
      # Per-attempt wait for a pod to come up with a public SSH endpoint. Much
      # larger than the gpu block's 300s: the EDA image carries a full PDK and
      # toolchain, so a cold-machine pull takes many minutes.
      - key: EDA_PROVISION_TIMEOUT
        value: "900"
      # Terminate and recreate on a no-public-IP placement or transient capacity
      # shortage, hopping to a different machine.
      - key: EDA_PROVISION_ATTEMPTS
        value: "3"
      # If the port-22 mapping has not appeared this long after placement, the
      # machine has no public-IP networking — fail fast and hop instead of waiting
      # out the full provision timeout.
      - key: EDA_PUBLIC_IP_GRACE
        value: "180"
      # Total wall-clock ceiling for one run across all stages. Cost control, not
      # UX: a stage timeout bounds one stage, this bounds the bill. A pod left
      # routing over a weekend is real money.
      - key: EDA_MAX_RUN_MINUTES
        value: "180"
      # Per-stage ceilings (seconds). Routing dominates everything else by an
      # order of magnitude, hence its own budget. Raise for large designs.
      - key: EDA_STAGE_TIMEOUT_SYNTH
        value: "900"
      - key: EDA_STAGE_TIMEOUT_FLOORPLAN
        value: "600"
      - key: EDA_STAGE_TIMEOUT_PLACE
        value: "1800"
      - key: EDA_STAGE_TIMEOUT_CTS
        value: "900"
      - key: EDA_STAGE_TIMEOUT_ROUTE
        value: "7200"
      - key: EDA_STAGE_TIMEOUT_FINAL
        value: "1800"
      # Artifact caps. Far larger than the gpu block's because a sky130 GDS for
      # even a small design is several MB. Bytes.
      - key: EDA_ARTIFACT_MAX_FILE_BYTES
        value: "33554432"
      - key: EDA_ARTIFACT_MAX_TOTAL_BYTES
        value: "67108864"
      # Above this, a gate-level netlist is not echoed into a port .txt file; it
      # travels as an artifact instead and the openroad block accepts either form.
      - key: EDA_NETLIST_INLINE_MAX
        value: "1048576"
